[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-editor"
version = "0.1.0"
description = "Programmatic, agent-assisted video editing toolkit (transcribe -> analyze -> overlay -> walkthrough -> compose)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "faster-whisper>=1.0",
    "Pillow>=10",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "scenedetect>=0.7",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ai-video-editor = "ai_video_editor.cli:main"

[tool.setuptools.packages.find]
include = ["ai_video_editor*"]
