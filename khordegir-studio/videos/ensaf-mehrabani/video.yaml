      پاش نگه می‌داره چون می‌دونه «شاید دفعه‌ی بعدی دربیاد». وقتی تو دو بار نه می‌گی و بار سوم زیر فشار
      کوتاه می‌آی، به مشتری یاد ندادی احترامت رو نگه داره؛ یادش دادی که «فقط کافیه یکم بیشتر فشار بیارم
