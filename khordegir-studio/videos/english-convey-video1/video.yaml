- template: split_compare
  eyebrow: GOFFMAN'S LENS (1959)
  title: Social life as *theater*
  a_icon: 🎭
  a_title: Front stage
  a_body: 'Before an audience

    We manage how we appear'
  a_tone: accent
  b_icon: 🚪
  b_title: Back stage
  b_body: 'Away from the audience

    We relax parts of the act'
  b_tone: muted
  verdict: Our interpretation — not a lab finding
  source: Goffman (1959), The Presentation of Self in Everyday Life
  layout: SCAM
  say: Goffman compared social life to theater. On the front stage, before an audience, we manage how we appear. Away from
    that audience, people can relax parts of their public performance. To keep a gathering smooth, people often cooperate
    on the surface. They protect a shared "definition of the situation," as Goffman put it. When one person steps off-script,
    the room pauses for a beat. When does a brief pause turn into real resentment? In 2008, Monin and his team studied people
    who refuse on principle. They called that person a "moral rebel."
  act: 3
- template: lower_third
  name: Monin, Sawyer & Marquez (2008)
  role: 4 studies · US undergraduates · "The Rejection of Moral Rebels"
  tag: MORAL REBELS
  layout: SCAM
  say: In one study, students recorded a speech against their own view. Those who went along disliked a peer who refused.
