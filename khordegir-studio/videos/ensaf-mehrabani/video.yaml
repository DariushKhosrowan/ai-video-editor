# ─────────────────────────────────────────────────────────────────────────────
# ویدیو: انصاف و مهربانی  (نمونه‌ی کامل و واقعی Khordegir Studio)
# ساخت:   python3 -m khordegir build videos/ensaf-mehrabani
# هر اسلاید با «- template:» شروع می‌شود. say = متن تله‌پرامپتر.
# layout: SLIDE (اسلاید تمام‌صفحه) | SCAM (اسلاید + من، گوشه‌ی پایین-چپ خالی) | CAM (فقط من)
# steps: قدم‌های بعدی روی همان اسلاید (هر قدم = یک PageDown در OBS)
# رنگ در متن: *زرد* برای عدد/نکته‌ی مثبت، ~قرمز~ برای عدد بد، _خاکستری_ برای توضیح
# عددها و منبع‌ها از slides/slide-plan.md و slides/studio/layers (نسخه‌ی اصلاح‌شده) آمده‌اند؛
# داده‌ی هفتگی اسلاید ۱۲ واقعی است (Gneezy & Rustichini 2000، جدول ۱). متن say از script-v3-natural.md اصلاح‌شده.
# ─────────────────────────────────────────────────────────────────────────────
title: انصاف و مهربانی
theme: khordegir-dark
# پوشه‌هایی که عکس‌ها در آن‌ها جست‌وجو می‌شوند (به ترتیب)
images:
  - img
  - ../../../slides/studio/layers/img
  - ../../../slides/assets/gen
  - ../../../slides/assets/real
# پوشه‌ی HarkStudio برای کپی خروجی (با --copy-to هم می‌شود داد)
studio: ../../../slides/studio
# فعلاً فقط mp4 کپی می‌شود (PNGها و steps_data.lua را عامل دیگری می‌سازد).
# برای ویدیوی جدید معمولاً:  copy: [mp4, png, steps, prompter]
copy: [mp4]
duration: 6          # طول هر کلیپ به ثانیه (حداقل؛ ۲٫۵ ثانیه‌ی آخر کاملاً ثابت)

slides:

