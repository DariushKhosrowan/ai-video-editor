  say: In another study, students chose the likely burglary suspect out of three. It was a racially biased suspect-choice
    task. Information was set up to point at the only Black suspect. The rebel refused, calling it biased. People who went
    along tended to like the refuser less. Still, the gap was smaller this time. Outside observers rated him as more moral,
    yet did not significantly prefer him. Why did going along spark dislike? A third test pointed to an explanation. People
    who went along expected the rebel to look down on them. That expected rejection helped explain their dislike.
  act: 3
