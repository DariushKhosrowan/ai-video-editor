# ─────────────────────────────────────────────────────────────
# ویدیوی جدید — هر قالب یک بار به‌عنوان نمونه آمده. هرکدام را لازم نداری پاک کن.
# ساخت:  python3 -m khordegir build videos/<اسم-ویدیو>
# رنگ در متن: *زرد*  ~قرمز~  _خاکستری_   |   layout: SLIDE | SCAM | CAM
# say = متن تله‌پرامپتر. steps = قدم‌های بیشتر روی همان اسلاید.
# ─────────────────────────────────────────────────────────────
title: ویدیوی جدید
theme: khordegir-dark
images: [img]      # عکس‌ها را در پوشه‌ی img کنار همین فایل بگذار
# studio: ../../../slides/studio    # پوشه‌ی HarkStudio برای کپی خودکار خروجی
copy: [mp4, png, steps, prompter]
duration: 6
livingStage:
  bgStyle: dreamy-bokeh
  intensity: podcast
  microMotion: true
  floatMode: selective
  floatAmplitude: 5
  floatSpeed: 0.75
  floatRatio: 0.65
  floatSeed: 0

slides:

  # ── کارت عنوان: یک عنوان بزرگ با تیتر کوچک و زیرعنوان؛ می‌تواند روی یک عکس تمام‌صفحه‌ی تیره باشد. برای شرو
  - template: title_card
    eyebrow: یک سؤال ساده
    title: پول می‌دی یا به *پلیس* زنگ می‌زنی؟
    subtitle: قانونی که پشت همه‌ی باج‌گیری‌ها هست
    image: /assets/podcast-studio-mic.jpg
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── مقاله و زوم روی متن: نمایش برگهٔ پژوهش یا روزنامه و زوم سینمایی روی جملهٔ کلیدی + هایلایت ماژیکی
  - template: article_zoom
    eyebrow: بررسی سند و پژوهش
    publication: Journal of Behavioral Economics · 2024
    article_title: چرا ==پاداش غیرقابل‌پیش‌بینی== رفتار را تثبیت می‌کند؟
    author: گزیدهٔ گزارش آزمایشگاهی · صفحهٔ ۱۴
    article_body: |
      در آزمایش‌های رفتاری مشخص شد زمانی که نظام پاداش کاملاً ثابت است، واکنش مغز خیلی زود افت می‌کند.
      اما تغییر نامنظم زمانِ پاداش باعث تداوم دو برابری کنش و پیگیری می‌شود.
    focus_text: پاداشِ گاه‌به‌گاه و غیرقابل‌پیش‌بینی تا ۳ برابر ماندگاری رفتار را افزایش می‌دهد.
    image: /assets/archive-newspaper.jpg
    paper_theme: warm-paper
    zoom_scale: 1.36
    layout: SCAM
    say: به این پاراگراف کلیدی در پژوهش دقت کنید؛ دقیقاً همین جمله علت ماندگاری رفتار را توضیح می‌دهد.

  # ── عدد بزرگ: یک عدد خیلی بزرگ که از صفر می‌شمارد (مثل ۸۰٪) با یک جمله زیرش؛ اختیاری با عکس کنارش.
  - template: big_number
    number: '80'
    suffix: ٪
    color: danger
    caption: شرکت‌هایی که باج دادند، دوباره هدف حمله قرار گرفتند
    detail: نظرسنجی از نزدیک به ۱٬۵۰۰ مدیر امنیت
    source: Cybereason, 2022
    layout: SCAM
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── عکس + متن: یک عکس در قاب گرد (آرام نفس می‌کشد) و کنارش تیتر کوچک، عنوان، متن و چند نکته.
  - template: image_text
    eyebrow: بی. اف. اسکینر، ۱۹۵۷
    title: پاداشِ گاه‌به‌گاه
    text: سرسخت‌ترین رفتار وقتی ساخته می‌شه که *فقط گاهی* جواب بگیره
    source: Ferster & Skinner, 1957
    image: /assets/psychology-lab.jpg
    layout: SCAM
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── نمودار میله‌ای: میله‌ها از پایین رشد می‌کنند و عددها روی‌شان می‌شمارند. افقی هم می‌شود (برای برچسب‌های بلن
  - template: bar_chart
    title: آدم‌ربایی‌های ثبت‌شده در ایتالیا
    data:
    - label: ۱۹۶۹ تا ۱۹۹۱
      value: 630
      color: danger
    - label: ۷ سال بعد از قانون ۱۹۹۱
      value: 38
      color: accent
    source: Bohlen / NYT, 1998; Avraham & Porat, 2023
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── فهرست / کارت‌ها: چند مورد که یکی‌یکی وارد می‌شوند؛ با شماره یا بدون آن، یک یا دو ستون.
  - template: bullet_list
    title: سه سؤالِ قبل از کوتاه اومدن
    items:
    - کی زیر فشاره و کی داره از بقیه خرج می‌کنه؟
    - اولین بارشه یا تبدیل به عادت شده؟
    - پناه و اهرم داری یا واقعاً ~گروگانِ بقایی؟~
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── نمودار خطی: یک یا چند خط که از چپ به راست کشیده می‌شوند، با برچسب در انتهای هر خط و خط‌چین‌های رویداد.
  - template: line_chart
    title: سهم همکاری در هر دور بازی
    series: 'با تنبیه: 13.5, 15.5, 16.5, 17.2, 17.6, 17.9, 18.2, 18.4, 18.5, 18.2
  
      بدون تنبیه: 10, 9.4, 8.9, 8.5, 8.1, 7.7, 7.2, 6.5, 5.5, 3.2'
    ymax: 20
    source: Fehr & Gächter, 2000 (AER)
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── قبل ← بعد: دو یا سه عدد بزرگ با فلش بینشان (مثل ۸ ← ۱۶ ← ۱۹). از راست به چپ خوانده می‌شود.
  - template: compare
    title: میانگین تأخیر هفتگی در مهدکودک‌ها
    steps:
    - value: 8
      label: قبل از جریمه
      color: muted
    - value: 16
      prefix: +
      label: با جریمه‌ی ۳ دلاری
      color: accent
    - value: 19
      prefix: ≈
      label: بعد از حذف جریمه
      color: danger
    source: Gneezy & Rustichini, 2000
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── کارت‌های عددی: دو تا چهار کارت، هر کدام یک عدد که می‌شمارد و توضیح زیرش (مثل مقایسه‌ی دو گروه).
  - template: counter_grid
    title: آزمایش بیمه‌ی سلامت RAND
    cards:
    - value: 50
      prefix: +
      suffix: ٪
      label: مصرف بیشترِ خدمات درمانی وقتی برای افراد عادی رایگان شد
      sub: خطر اخلاقی
      color: accent
    - value: 14
      prefix: +
      suffix: ٪
      label: احتمال پیش‌بینی‌شده‌ی مرگ در کم‌درآمدهای دارای فشار خون بالا
      sub: وقتی هزینه روی دوششون گذاشتند
      color: danger
    source: Manning et al., 1987; Newhouse, 1993
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── جمله‌ی کلیدی: یک جمله‌ی بزرگ و پررنگ (با کلمه‌ی زرد/قرمز) و یک خط توضیح کوچک‌تر. برای قانون‌ها و جمع‌بند
  - template: quote
    text: هر رفتاری که پاداشش بدی،
    highlight: بیشتر می‌شه
    layout: SCAM
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── جداکننده‌ی بخش: صفحه‌ی ساده بین دو بخش: شماره/اسم بخش و یک عنوان کوتاه. برای لحظه‌هایی که بیشتر خودت حرف م
  - template: section_break
    eyebrow: بخش سوم
    title: «خودش طلبکار می‌شه!»
    layout: SCAM
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── عکس تمام‌صفحه: عکس بزرگ با زیرنویس پررنگ؛ در حالت SCAM عکس در قاب بزرگ بالا-راست می‌نشیند تا جای دوربین خ
  - template: image_full
    title: '*تنبیه ضداجتماعی* در ۱۶ شهر دنیا'
    text: ضعیف‌تر بودن اعتماد و قانون ← حمله‌ی مفت‌خور به آدمِ درستکار
    image: /assets/world-map-dark.jpg
    dots:
    - 20,40
    - 26,36
    - 48,32,danger
    - 52,30
    - 60,45,danger
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── سه کارت: سه (یا دو تا پنج) کارت کنار هم، هر کدام با عکس یا نماد و یک برچسب. اختیاری: یک عکس مشترک ب
  - template: three_cards
    cards:
    - label: مشتری
      icon: 🧾
    - label: همکار
      icon: 💼
    - label: کارفرما
      icon: 🏢
    layout: SCAM
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── گفتگوی پیام‌رسان: حباب‌های پیام یکی‌یکی ظاهر می‌شوند. «او» سمت راست (خاکستری)، «من» سمت چپ (سبز تیره)، لحن ب
  - template: chat
    messages:
    - from: او
      text: این دو تا بخش جدیدم اضافه کن؛ *کار پنج دقیقه‌ست!*
    - from: من
      text: توی قرارمون نبوده
    - from: من
      text: باز هم نه، زمان می‌بره
    - from: او
      text: ای بابا، روت حساب کرده بودیم رفیق!
    - from: من
      text: باشه... می‌زنم
      tone: bad
    layout: SCAM
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── خط زمان: یک خط افقی که از راست به چپ کشیده می‌شود و نقطه‌های تاریخ با توضیح، یکی‌یکی روی آن ظاهر می
  - template: timeline
    title: ایتالیا و آدم‌ربایی
    events:
    - date: ۱۹۶۹
      text: شروع موج آدم‌ربایی
    - date: ۱۹۹۱
      text: قانون مسدود کردن حساب خانواده
      tone: good
    - date: ۱۹۹۸
      text: فقط ۳۸ مورد در ۷ سال
    layout: SLIDE
    say: متن تله‌پرامپتر این اسلاید اینجا.

  # ── فقط دوربین (بدون اسلاید): این قدم اسلاید ندارد؛ فقط تصویر خودت تمام‌صفحه. در خروجی OBS به‌صورت CAM ثبت می‌شود و فایل
  - template: cam
    layout: CAM
    say: متن تله‌پرامپتر این اسلاید اینجا.
