      جرم‌شناس‌ها می‌گن فقط اون قانون نبود—هم‌زمان فشار پلیس بیشتر شد، مافیا هم سرمایه‌ش رو برد سمت قاچاق
      کوکائین، و بعضی خانواده‌ها هم پنهانی پول دادن و گزارش نکردن.

# ── اسلاید 04 · «قانون ۱۹۹۱: حساب خانواده مسدود می‌شد» + small note «عوامل دیگر هم نقش ──
  - template: image_text
