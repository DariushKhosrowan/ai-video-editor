    say: به‌نظر میاد یه لطف کوچیک کردی و تموم شد، نه؟ ولی یه اتفاقِ خیلی بدتر افتاده. سال ۱۹۵۷، بی. اف.
      اسکینر و همکارش (فِرستر) نتیجه‌ی سال‌ها آزمایش روی رفتار کبوترها رو منتشر کردن. دیدن اگه هر بار که
      طرف یه کاری می‌کنه بهش پاداش بدی، به‌محض اینکه پاداش رو قطع کنی، خیلی زود دست می‌کشه.

