  title: Fear *Inside* Your Own Head
  subtitle: Before anyone reacts, you feel it first.
  layout: SCAM
  say: Look first from the asker's side. In one Columbia study, students asked strangers to walk them to the gym. Before starting,
    they guessed they would ask 7.2 people for one yes.
  act: 2
- template: study_card
  eyebrow: STUDY · 2008
  sample: Columbia students
  authors: Flynn & Lake (2008)
  journal: Journal of Personality and Social Psychology
  finding: Find *one* stranger who will walk you to the gym. How many people will you have to ask?
  stats: 'Predicted asks: 7.2 | danger

    Actual asks: 2.3 | accent'
  caveat: Study 2 · averages per participant
  source: Flynn & Lake (2008), JPSP 95(1), 128–143
  layout: SCAM
  say: 'In reality, they needed an average of 2.3 people for one yes. They expected to ask roughly three times as many people
    as needed. Why were their guesses so far off? Askers focus on the favor. They underestimate how uncomfortable it feels
    to refuse a face-to-face request. That social pressure helps explain why people sometimes agree. That was the asker''s
    side. Now flip the camera: what happens when you turn down an invitation? That''s what Givi and Kirk studied.'
  act: 2
- template: split_compare
  eyebrow: FLIP THE CAMERA
  title: Two sides of a *no*
  a_icon: 🙋
  a_title: The person asking
  a_body: 'Flynn & Lake (2008)

    Underestimate how hard refusing feels'
  a_tone: muted
  b_icon: 🙅
  b_title: The person saying no
  b_body: 'Givi & Kirk (2024)

    Overestimate how badly the no will land'
  b_tone: accent
  layout: SCAM
  say: In a small pilot survey of 51 people, 77 percent said they had accepted an unwanted invitation. They feared what declining
    would cause. Then in 2024, they reported five studies with over 2,000 participants. One study even used real couples.
    One partner wrote a real invitation. The other was instructed to decline it. Both partners then reported their reactions.
  act: 2
- template: study_card
  eyebrow: STUDY · 2024
  sample: 5 studies · 2,000+ people
  authors: Givi & Kirk (2024)
  journal: Journal of Personality and Social Psychology
  finding: 'Pilot survey: most had said yes to an invitation they *didn''t want*, out of fear of declining.'
  stats: 'Pilot (51 people): 77% | accent'
  caveat: Plus five main studies — one with real couples.
  source: Givi & Kirk (2024), JPSP 126(6), 1103–1115
  layout: SCAM
  say: The pattern was consistent. People saying no overestimated how upset the person inviting would feel. They also overestimated
    how likely they were to lose future invitations. Why did they misread the reaction? People saying no think the focus stays
    on the bare "no." But people inviting reported thinking more about the thoughts behind the decision.
  act: 2
- template: split_compare
  eyebrow: THE MIND GAP
  title: What decliners *expect* vs what inviters *report*
  a_icon: 🔴
  a_title: You expect
  a_body: 'They focus on the bare "NO"

    They''ll be upset

    Fewer invites later'
  a_tone: danger
  b_icon: 💭
  b_title: Inviters report
  b_body: 'They think about the thoughts behind your decision

    Less upset than you fear'
  b_tone: accent
  verdict: Everyday invitations · scenario studies + one couples study
  layout: SCAM
  say: Keep their scope in mind. These were mostly everyday, low-stakes invitations. Many were scenario studies, plus one
    study with real couples. They did not track long-term relationship damage. Big life events or different cultures may also
    work differently. Still, with everyday invitations, we often overestimate how negatively the other person will react.
    So why do some rooms still freeze? That brings us to the second force. None of these studies tested our exact café scene.
    Together, they help explain why two quiet refusals land so differently.
  act: 2
- template: split_compare
