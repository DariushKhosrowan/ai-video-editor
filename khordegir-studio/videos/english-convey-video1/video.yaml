  layout: SCAM
  say: You pick vanilla. Your friends pick chocolate. Nobody feels judged, because your taste doesn't question theirs. Now
    compare that with our central idea. A personal boundary tells people what you won't do. A principled refusal can make
    people question what they're doing.
