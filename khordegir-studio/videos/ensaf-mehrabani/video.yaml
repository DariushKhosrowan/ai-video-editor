      یکی پاشو می‌ذاره روی حقت، تو کوتاه بیای که دعوا نشه، دقیقاً داری یادش می‌دی این کار جواب می‌ده—و توی
      دفعه‌ی بعدی، هم برای تو بدتر می‌شه، هم سرِ نفر بعدی پیاده‌ش می‌کنه.'

