<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Khordegir Stage</title>
<link rel="stylesheet" href="stage.css">
<script src="../vendor/gsap.min.js"></script>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="fx.js"></script>
<script src="../themes/_list.js"></script>
<script src="template-lib.js"></script>
<script src="../templates/_index.js"></script>
<script>Stage.writeIncludes();</script>
</head>
<body>
<div id="stage"></div>
<script>
  // ?demo=<template> shows a template's built-in example (used by the gallery)
  const q = new URLSearchParams(location.search);
  window.addEventListener("load", async () => {
    if (q.get("theme")) Stage.useTheme(q.get("theme"));
    if (q.get("demo")) {
      const t = Stage.templates[q.get("demo")];
      if (t) { const ex = Object.assign({ template: t.name }, t.example || {}); await Stage.load(ex, { camGuide: q.has("cam") });
               if (q.has("t")) Stage.seek(+q.get("t")); else Stage.play(0); }
    }
    document.title = "ready";
  });
</script>
</body>
</html>
