  title: Standing *Alone*
  subtitle: Nobody needs to judge you. It still feels heavy.
  layout: SCAM
  say: Even without moral judgment, matching the group pulls hard on us. Think back to Solomon Asch's classic line tests.
    They ran in the early 1950s and were reported in 1955. People matched line lengths on simple cards.
  act: 4
- template: study_card
  eyebrow: ASCH · 1955
  sample: 123 people
  authors: Solomon Asch (1955)
  journal: Scientific American · "Opinions and Social Pressure"
  finding: Match a line on a card. Alone it's easy. Then everyone else gives the *same wrong answer*.
  stats: 'Alone: <1% | muted

    With the group: 36.8% | accent'
  caveat: 36.8% of answers — not of people. ~1/4 never went along; ~3/4 went along at least sometimes.
  source: Asch (1955), Scientific American 193(5), 31–35
  layout: SCAM
  say: Under ordinary conditions, people got less than 1 percent wrong. The task was obvious. Then Asch placed one real participant
    with actors working for him. Everyone else gave the same wrong answer. Suddenly, 36.8 percent of those test answers turned
    wrong. Notice what that number means. That is 36.8 percent of answers, not people. About one quarter of participants never
    went along. Roughly three quarters went along at least sometimes. (pause) Watch the pattern as the group grows. With one
    wrong opponent, errors sat at 3.6 percent. With two, they jumped to 13.6 percent. With three, they hit 31.8 percent. After
    three voices, bigger majorities added very little.
  act: 4
- template: stat_bars
  eyebrow: ASCH (1955)
  title: Errors by size of the wrong *majority*
  items: '1 opponent: 3.6

    2 opponents: 13.6

    *3 opponents*: 31.8'
  highlight: 3 opponents
  max: 40
  suffix: '%'
  decimals: 1
  unit: Bigger majorities added very little.
  layout: SCAM
  say: Of course, matching lines in a lab isn't real life. Still, look back at our four friends. Three agree, and you are
    the fourth. Through this lens, just three people can start to feel like everyone. Yet Asch found one hopeful twist. With
    one truthful partner, people answered wrongly only one fourth as often.
