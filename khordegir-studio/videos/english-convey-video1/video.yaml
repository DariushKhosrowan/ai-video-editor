    One says *"I''m good, thanks."*'
  align: center
  layout: SCAM
  say: Picture four friends at a café table. Someone lifts a phone to film the table for social media. Three friends lean
    into the shot. The fourth smiles and quietly says, "I'm good, thanks." No explanation. No apology. No anger. Just that
    calm refusal. (pause) For a moment, the conversation stops. Someone looks down at their phone. Another friend looks away.
    Why can two quiet words make a room freeze?
  act: 1
- template: title_card
  eyebrow: ENGLISH CONVEY · PSYCHOLOGY
  title: Why Quietly Saying *"No"* Makes Everyone Uncomfortable
  subtitle: Three forces behind a five-second silence
  layout: SCAM
  say: Of course, a quiet "no" doesn't literally make everyone uncomfortable. Sometimes the heaviest tension lives inside
    your own head. Other times, the room really does tighten up.
  act: 1
