# ── اسلاید 07 · Freelancer chat mockup: «کار پنج دقیقه‌ست!» → نه / نه / باشه ──
  - template: chat
    messages:
    - from: او
      text: این دو تا بخش جدیدم اضافه کن؛ *کار پنج دقیقه‌ست!*
    - from: من
      text: توی قرارمون نبوده
    - from: من
      text: باز هم نه، زمان می‌بره
    - from: او
      text: ای بابا، روت حساب کرده بودیم رفیق!
    - from: من
      text: باشه... می‌زنم
      tone: bad
    act: 2
    layout: SCAM
    say: 'اول ببین توی روابط معمولی چه اتفاقی می‌افته. تصور کن کار طراحی یا تدوین می‌کنی. قیمت رو طی کردی،
      وسط کار مشتری پیام می‌ده: «راستی می‌شه این دو تا بخش جدیدم اضافه کنی؟ کار پنج دقیقه‌ست.» تو می‌دونی
      کار دو ساعته. دفعه‌ی اول می‌گی توی قرارمون نبوده. دفعه‌ی دومم نه می‌گی. اما بار سوم، طرف یکم لحنش
      رو مظلوم می‌کنه یا با کنایه می‌گه «ما روت حساب کرده بودیم رفیق!» و تو دیگه حوصله‌ی کل‌کل نداری؛ می‌گی
      باشه، می‌زنم.'
    time: '1:25'

