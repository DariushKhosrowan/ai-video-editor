        می‌کنی و می‌دی؟

# ── اسلاید 02 · «ایتالیا، ۱۹۶۹ تا ۱۹۹۱» archive newspaper on kidnappings ──
  - template: image_text
    image: italy_kidnap_archive.jpg
    title: '*ایتالیا، ۱۹۶۹ تا ۱۹۹۱*'
    text: خانواده‌ها برای نجات عزیزشون باج می‌دادن
    act: 1
    layout: SCAM
    say: 'این سؤالِ بی‌جواب نیست. توی دهه‌ی ۷۰ و ۸۰ میلادی توی ایتالیا، دقیقاً برای اینکه خانواده‌ها حق
      داشتن بخوان عزیزشون زنده برگرده، باج می‌دادن. نتیجه‌ش چی شد؟ بین سال‌های ۱۹۶۹ تا ۱۹۹۱، حدود ۶۳۰ نفر
      توی ایتالیا ربوده شدن. تا اینکه سال ۱۹۹۱ دولت یه قانونِ به‌ظاهر بی‌رحمانه گذاشت: به محض اینکه گزارش
      آدم‌ربایی می‌اومد، حسابِ بانکیِ خودِ خانواده‌ی قربانی مسدود می‌شد که حتی اگه بخوان هم نتونن باج بدن.'
    time: 0:25

