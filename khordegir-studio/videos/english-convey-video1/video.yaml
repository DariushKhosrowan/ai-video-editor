  text: '*ONE* TRUTHFUL PARTNER'
  caption: Wrong answers only one fourth as often (Asch, 1955)
  tone: accent
  layout: SCAM
  say: In our view, that holds a quiet lesson. Even one person breaking a unanimous majority can make it easier to disagree.
