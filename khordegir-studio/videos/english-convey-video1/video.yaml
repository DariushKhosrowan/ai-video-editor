  source: Holubar (2015) OSF a4fmg · Monin (2015) OSF 3s2zd
  layout: SCAM
  say: In the original study, writing first about a personal value removed that gap in liking. Still, keep two limits in mind.
    These were morally charged tasks, not dinner plans. Also, a later online replication of that last study did not repeat
    the result. However, it was disputed. The original author argued key details changed—both the writing task and the setting.
    So treat that finding with caution. In Force 2, people feel judged by your refusal. In Force 3, nobody needs to judge
    you. Standing alone feels heavy by itself.
