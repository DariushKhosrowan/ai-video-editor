- template: three_cards
  title: Not every silence comes from strength
  cards:
  - icon: 🙈
    label: Silence from fear
    text: Hiding · going along
  - icon: 🧭
    label: Calm boundary
    text: A clear personal limit
  - icon: ⚖️
